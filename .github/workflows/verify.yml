name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - chore/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm check

      - name: Typecheck
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm typecheck

      - name: Test
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm test:run

      - name: Build
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
